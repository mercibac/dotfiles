# Set default volume to 60
volume=70

# Set default screen
fullscreen=no

# For thumbnail
# Disable the On Screen Controller (OSC).
osc=no

# Play french audio if available
alang=fr

video-sync=display-resample

# Fix windows bug introduced in 0.35 version
vd-lavc-dr=no

# Screenshot 
screenshot-directory="D:\Pictures\mpv"
screenshot-template="%F-%03n"

# Optimize the rendering of UHD contents
# --- profile first: it sets a batch of options, so anything
# --- below it wins on conflicts. Order matters here.
profile=fast

hwdec=auto-safe
# Options: "gpu-next" > "gpu"
vo=gpu-next

# HDR/DV tone-mapping cost
hdr-compute-peak=no
tone-mapping=hable
gamut-mapping-mode=clip

# 4K -> 1080p downscale cost
dscale=hermite
correct-downscaling=no

deband=no
interpolation=no 
